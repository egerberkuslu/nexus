server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable dynamic DNS resolution for Docker service names
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Proxy all API + WebSocket traffic through the gateway nginx service
    # to avoid frontend-specific routing drift when services restart.
    set $gateway_upstream http://nginx:80;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # WebSocket proxy (WebShell + topology live updates) - MUST come before / location
    location /ws/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 86400;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # API proxy - route everything to gateway
    location = /api {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Data Lab (JupyterLab) proxy - keep same-origin under the frontend (port 3000)
    location = /jupyter {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location ^~ /jupyter/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Same-origin proxy for shared Flink UI so it can be embedded and avoids mixed-content issues.
    # Usage: /infra-proxy/flink-shared/<path...>
    location ^~ /infra-proxy/flink-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $flink_ui_upstream flink-jobmanager:8081;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/flink-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        rewrite ^/infra-proxy/flink-shared/(.*)$ /$1 break;
        proxy_pass http://$flink_ui_upstream;
    }

    # Same-origin proxy for shared Spark UI so it can be embedded (Spark sets X-Frame-Options: SAMEORIGIN).
    # Usage: /infra-proxy/spark-shared/<path...>
    location ^~ /infra-proxy/spark-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $spark_ui_upstream spark-master:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/spark-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter "setUIRoot('')" "setUIRoot('/infra-proxy/spark-shared')";
        sub_filter "setUIRoot(\\\"\\\")" "setUIRoot(\\\"/infra-proxy/spark-shared\\\")";
        sub_filter 'href="/' 'href="/infra-proxy/spark-shared/';
        sub_filter 'src="/' 'src="/infra-proxy/spark-shared/';
        sub_filter 'action="/' 'action="/infra-proxy/spark-shared/';

        rewrite ^/infra-proxy/spark-shared/(.*)$ /$1 break;
        proxy_pass http://$spark_ui_upstream;
    }

    # Same-origin proxy for shared HDFS NameNode UI so it can be embedded (HDFS sets X-Frame-Options: SAMEORIGIN).
    # Usage: /infra-proxy/hdfs-shared/<path...>
    #
    # Note: Hadoop's NameNode UI JS uses absolute paths (e.g. "/jmx", "/webhdfs/v1") which break when the UI is
    # mounted under a prefix like "/infra-proxy/hdfs-shared". We rewrite those in the specific JS entrypoints.
    location = /infra-proxy/hdfs-shared/dfshealth.js {
        resolver 127.0.0.11 valid=10s;
        set $hdfs_ui_upstream hdfs-namenode:9870;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/hdfs-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter '"/jmx' '"/infra-proxy/hdfs-shared/jmx';
        sub_filter "'/jmx" "'/infra-proxy/hdfs-shared/jmx";
        sub_filter '"/startupProgress' '"/infra-proxy/hdfs-shared/startupProgress';
        sub_filter "'/startupProgress" "'/infra-proxy/hdfs-shared/startupProgress";
        sub_filter '"/conf' '"/infra-proxy/hdfs-shared/conf';
        sub_filter "'/conf" "'/infra-proxy/hdfs-shared/conf";

        rewrite ^/infra-proxy/hdfs-shared/(.*)$ /$1 break;
        proxy_pass http://$hdfs_ui_upstream;
    }

    location = /infra-proxy/hdfs-shared/explorer.js {
        resolver 127.0.0.11 valid=10s;
        set $hdfs_ui_upstream hdfs-namenode:9870;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/hdfs-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter '"/webhdfs/v1' '"/infra-proxy/hdfs-shared/webhdfs/v1';
        sub_filter "'/webhdfs/v1" "'/infra-proxy/hdfs-shared/webhdfs/v1";

        rewrite ^/infra-proxy/hdfs-shared/(.*)$ /$1 break;
        proxy_pass http://$hdfs_ui_upstream;
    }

    location ^~ /infra-proxy/hdfs-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $hdfs_ui_upstream hdfs-namenode:9870;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/hdfs-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/' 'href="/infra-proxy/hdfs-shared/';
        sub_filter 'src="/' 'src="/infra-proxy/hdfs-shared/';
        sub_filter 'action="/' 'action="/infra-proxy/hdfs-shared/';

        rewrite ^/infra-proxy/hdfs-shared/(.*)$ /$1 break;
        proxy_pass http://$hdfs_ui_upstream;
    }

    # Same-origin proxy for shared Kafka UI so it can be embedded (Kafka UI sets X-Frame-Options: DENY).
    # Usage: /infra-proxy/kafka-ui-shared/<path...>
    location ^~ /infra-proxy/kafka-ui-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $kafka_ui_upstream kafka-ui:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/kafka-ui-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;

        # Fix basePath used by the app
        sub_filter "window.basePath = '';" "window.basePath = '/infra-proxy/kafka-ui-shared';";

        # Rewrite absolute asset URLs in the boot HTML
        sub_filter 'src=\"/assets/' 'src=\"/infra-proxy/kafka-ui-shared/assets/';
        sub_filter 'href=\"/assets/' 'href=\"/infra-proxy/kafka-ui-shared/assets/';
        sub_filter 'url(/fonts/' 'url(/infra-proxy/kafka-ui-shared/fonts/';
        sub_filter 'href=\"/fonts/' 'href=\"/infra-proxy/kafka-ui-shared/fonts/';
        sub_filter 'href=\"/favicon/' 'href=\"/infra-proxy/kafka-ui-shared/favicon/';
        sub_filter 'href=\"/manifest.json\"' 'href=\"/infra-proxy/kafka-ui-shared/manifest.json\"';

        rewrite ^/infra-proxy/kafka-ui-shared/(.*)$ /$1 break;
        proxy_pass http://$kafka_ui_upstream;
    }

    # Same-origin proxy for shared HiveServer2 Web UI.
    # Usage: /infra-proxy/hive-shared/<path...>
    location ^~ /infra-proxy/hive-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $hive_ui_upstream hive-server2:10002;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/hive-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/' 'href="/infra-proxy/hive-shared/';
        sub_filter 'src="/' 'src="/infra-proxy/hive-shared/';
        sub_filter 'action="/' 'action="/infra-proxy/hive-shared/';

        rewrite ^/infra-proxy/hive-shared/(.*)$ /$1 break;
        proxy_pass http://$hive_ui_upstream;
    }

    # Same-origin proxy for shared pgAdmin UI (PostgreSQL admin).
    # Usage: /infra-proxy/pgadmin-shared/<path...>
    location = /infra-proxy/pgadmin-shared {
        return 308 /infra-proxy/pgadmin-shared/;
    }

    location ^~ /infra-proxy/pgadmin-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $pgadmin_ui_upstream pgadmin:80;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/pgadmin-shared;

        # pgAdmin uses these headers/env to operate under a prefix.
        proxy_set_header X-Script-Name /infra-proxy/pgadmin-shared;
        proxy_set_header X-Scheme $scheme;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        proxy_pass http://$pgadmin_ui_upstream;
    }

    # Same-origin proxy for shared Mongo Express UI.
    # Usage: /infra-proxy/mongo-express-shared/<path...>
    location = /infra-proxy/mongo-express-shared {
        return 308 /infra-proxy/mongo-express-shared/;
    }

    location ^~ /infra-proxy/mongo-express-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $mongo_express_ui_upstream mongo-express:8081;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/mongo-express-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        proxy_pass http://$mongo_express_ui_upstream;
    }

    # Same-origin proxy for shared Hue UI.
    # Usage: /infra-proxy/hue-shared/<path...>
    location = /infra-proxy/hue-shared {
        return 308 /infra-proxy/hue-shared/;
    }

    location ^~ /infra-proxy/hue-shared/ {
        resolver 127.0.0.11 valid=10s;
        set $hue_ui_upstream hue:8888;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/hue-shared;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Hue does not natively support being mounted under a prefix. We strip the prefix for the upstream,
        # then rewrite common absolute paths in the response back under /infra-proxy/hue-shared/.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter 'href="/' 'href="/infra-proxy/hue-shared/';
        sub_filter 'src="/' 'src="/infra-proxy/hue-shared/';
        sub_filter 'action="/' 'action="/infra-proxy/hue-shared/';
        # Rewrite absolute JS fetch/XHR targets (avoid broad '"/' rewrites which corrupt self-closing tags like ...ico"/>).
        sub_filter '"/static/' '"/infra-proxy/hue-shared/static/';
        sub_filter "'/static/" "'/infra-proxy/hue-shared/static/";
        sub_filter '"/hue/' '"/infra-proxy/hue-shared/hue/';
        sub_filter "'/hue/" "'/infra-proxy/hue-shared/hue/";
        sub_filter '"/desktop/' '"/infra-proxy/hue-shared/desktop/';
        sub_filter "'/desktop/" "'/infra-proxy/hue-shared/desktop/";
        sub_filter '"/about/' '"/infra-proxy/hue-shared/about/';
        sub_filter "'/about/" "'/infra-proxy/hue-shared/about/";

        proxy_redirect ~^(/.*)$ /infra-proxy/hue-shared$1;
        proxy_cookie_path / /infra-proxy/hue-shared/;

        rewrite ^/infra-proxy/hue-shared/(.*)$ /$1 break;
        proxy_pass http://$hue_ui_upstream;
    }

    # Same-origin proxy for per-topology Kafka UI so it can be embedded (Kafka UI sets X-Frame-Options: DENY).
    # Usage: /infra-proxy/kafka-ui/<topology_id8>/<path...>
    location ~ "^/infra-proxy/kafka-ui/([0-9a-f]{8})/(.*)$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $path $2;
        set $kafka_ui_upstream http://caduceus-topo-$id8-kafka-ui:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/kafka-ui/$id8;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;

        # Fix basePath used by the app
        sub_filter "window.basePath = '';" "window.basePath = '/infra-proxy/kafka-ui/$id8';";

        # Rewrite absolute asset URLs in the boot HTML
        sub_filter 'src=\"/assets/' 'src=\"/infra-proxy/kafka-ui/$id8/assets/';
        sub_filter 'href=\"/assets/' 'href=\"/infra-proxy/kafka-ui/$id8/assets/';
        sub_filter 'url(/fonts/' 'url(/infra-proxy/kafka-ui/$id8/fonts/';
        sub_filter 'href=\"/fonts/' 'href=\"/infra-proxy/kafka-ui/$id8/fonts/';
        sub_filter 'href=\"/favicon/' 'href=\"/infra-proxy/kafka-ui/$id8/favicon/';
        sub_filter 'href=\"/manifest.json\"' 'href=\"/infra-proxy/kafka-ui/$id8/manifest.json\"';

        proxy_pass $kafka_ui_upstream/$path$is_args$args;
    }

    # Same-origin proxy for per-topology Portainer UI so it can be embedded (Portainer sets anti-iframe headers).
    # Usage: /infra-proxy/portainer/<topology_id8>/<path...>
    location ~ "^/infra-proxy/portainer/([0-9a-f]{8})/(.*)$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $path $2;
        # Use Portainer's HTTP UI port inside the topology infra network.
        set $portainer_upstream http://caduceus-topo-$id8-portainer:9000;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Keep upstream redirects inside this proxy prefix.
        absolute_redirect off;
        proxy_redirect ~^(/.*)$ $scheme://$http_host/infra-proxy/portainer/$id8$1;

        # Best-effort rewrite for apps that hardcode absolute paths.
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter 'href="/' 'href="/infra-proxy/portainer/$id8/';
        sub_filter 'src="/' 'src="/infra-proxy/portainer/$id8/';
        sub_filter 'action="/' 'action="/infra-proxy/portainer/$id8/';
        sub_filter 'url(/' 'url(/infra-proxy/portainer/$id8/';

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $portainer_upstream/$path$is_args$args;
    }

    # Same-origin proxy for per-topology controller UIs so they can be embedded.
    # Usage: /infra-proxy/controllers/<topology_id8>/<controller_id>/<container_port>/<path...>
    location ~ "^/infra-proxy/controllers/([0-9a-f]{8})/([a-zA-Z0-9_-]+)/([0-9]{2,5})/(.*)$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $ctrl $2;
        set $port $3;
        set $path $4;
        set $ctrl_upstream http://caduceus-topo-$id8-ctrl-$ctrl:$port;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Fix controller UIs that set cookies with a Path that doesn't match the proxy prefix (e.g., ONOS uses Path=/onos/ui).
        proxy_cookie_path /onos/ui /infra-proxy/controllers/$id8/$ctrl/$port/onos/ui;
        proxy_cookie_path /onos/ui/ /infra-proxy/controllers/$id8/$ctrl/$port/onos/ui/;
        proxy_cookie_path /onos /infra-proxy/controllers/$id8/$ctrl/$port/onos;
        proxy_cookie_path /onos/ /infra-proxy/controllers/$id8/$ctrl/$port/onos/;

        # Keep upstream redirects inside this proxy prefix (e.g. ONOS redirects to /onos/ui/...).
        absolute_redirect off;
        proxy_redirect ~^http://localhost(:[0-9]+)?(/.*)$ $scheme://$http_host/infra-proxy/controllers/$id8/$ctrl/$port$2;
        proxy_redirect ~^(/.*)$ $scheme://$http_host/infra-proxy/controllers/$id8/$ctrl/$port$1;

        # Best-effort rewrite for apps that hardcode absolute paths (e.g. ONOS).
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter 'href=\"/onos/' 'href=\"/infra-proxy/controllers/$id8/$ctrl/$port/onos/';
        sub_filter 'src=\"/onos/' 'src=\"/infra-proxy/controllers/$id8/$ctrl/$port/onos/';
        sub_filter 'url(/onos/' 'url(/infra-proxy/controllers/$id8/$ctrl/$port/onos/';
        sub_filter 'action=\"/onos/' 'action=\"/infra-proxy/controllers/$id8/$ctrl/$port/onos/';
        sub_filter 'base href=\"/onos/' 'base href=\"/infra-proxy/controllers/$id8/$ctrl/$port/onos/';
        sub_filter '\"/onos/' '\"/infra-proxy/controllers/$id8/$ctrl/$port/onos/';
        sub_filter \"'/onos/\" \"'/infra-proxy/controllers/$id8/$ctrl/$port/onos/\";

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $ctrl_upstream/$path$is_args$args;
    }

    # Same-origin proxy for per-topology ETSI OSM NG-UI so it can be embedded and kept isolated per topology.
    # Usage: /infra-proxy/osm-ng-ui/<topology_id8>/<path...>
    # NOTE: OSM UIs make API calls under `/osm/...`. Route those calls directly to the per-topology NBI
    # to avoid relying on the UI container's internal proxy configuration.
    #
    # Compatibility: some OSM UI builds call `admin/v1/sdn_controllers`, but ETSI OSM exposes SDN controllers at
    # `admin/v1/sdns`. Alias these endpoints so the UI SDN pages work.
    #
    # Compatibility: some OSM UI builds call `admin/v1/vim_accounts/<id>/resources` to render the VIM edit page.
    # In some OSM/NBI builds this route is not exposed; return an empty payload so the UI doesn't hang.
    #
    # Some builds hit RO's path instead (`/ro/v1/vim_accounts/<id>/resources`) via the NBI reverse proxy; handle that too.
    location ~ "^/infra-proxy/osm-ng-ui/([0-9a-f]{8})/osm/admin/v1/vim_accounts/[^/]+/resources(/.*)?$" {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"resources":{},"images":[],"networks":[],"tenants":[],"flavors":[]}';
    }

    location ~ "^/infra-proxy/osm-ng-ui/([0-9a-f]{8})/osm/ro/v1/vim_accounts/[^/]+/resources(/.*)?$" {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"resources":{},"images":[],"networks":[],"tenants":[],"flavors":[]}';
    }

    location ~ "^/infra-proxy/osm-ng-ui/([0-9a-f]{8})/osm/admin/v1/sdn_controllers(/.*)?$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $rest $2;
        set $osm_nbi_upstream http://caduceus-osm-topo-$id8-nbi:9999;
        set $osm_accept "application/json";
        if ($http_accept ~* "(application/zip|text/plain)") { set $osm_accept $http_accept; }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-ng-ui/$id8;
        proxy_set_header Accept $osm_accept;

        proxy_cookie_path / /infra-proxy/osm-ng-ui/$id8/;
        proxy_cookie_flags session_id nosecure;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $osm_nbi_upstream/osm/admin/v1/sdns$rest$is_args$args;
    }

    # SDN controllers endpoint.
    location ~ "^/infra-proxy/osm-ng-ui/([0-9a-f]{8})/osm/admin/v1/sdns(/.*)?$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $rest $2;
        set $osm_nbi_upstream http://caduceus-osm-topo-$id8-nbi:9999;
        set $osm_accept "application/json";
        if ($http_accept ~* "(application/zip|text/plain)") { set $osm_accept $http_accept; }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-ng-ui/$id8;
        proxy_set_header Accept $osm_accept;

        proxy_cookie_path / /infra-proxy/osm-ng-ui/$id8/;
        proxy_cookie_flags session_id nosecure;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $osm_nbi_upstream/osm/admin/v1/sdns$rest$is_args$args;
    }

    location ~ "^/infra-proxy/osm-ng-ui/([0-9a-f]{8})/osm(/.*)?$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $rest $2;
        set $osm_nbi_upstream http://caduceus-osm-topo-$id8-nbi:9999;
        set $osm_accept "application/json";
        if ($http_accept ~* "(application/zip|text/plain)") { set $osm_accept $http_accept; }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-ng-ui/$id8;
        proxy_set_header Accept $osm_accept;

        # OSM NBI sets `Secure` cookies by default; strip it because this UI runs over plain HTTP in dev.
        # Also scope cookies to the proxy prefix to avoid cross-topology collisions.
        proxy_cookie_path / /infra-proxy/osm-ng-ui/$id8/;
        proxy_cookie_flags session_id nosecure;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $osm_nbi_upstream/osm$rest$is_args$args;
    }

    location ~ "^/infra-proxy/osm-ng-ui/([0-9a-f]{8})/(.*)$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $path $2;
        set $osm_ng_ui_upstream http://caduceus-osm-topo-$id8-ng-ui:80;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-ng-ui/$id8;
        proxy_set_header Accept-Encoding "";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        absolute_redirect off;
        proxy_redirect ~^(/.*)$ $scheme://$http_host/infra-proxy/osm-ng-ui/$id8$1;

        # Avoid cross-topology cookie collisions by scoping cookies to the proxy prefix.
        proxy_cookie_path / /infra-proxy/osm-ng-ui/$id8/;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;

        # Make the SPA work under this prefix.
        sub_filter '<base href="/">' '<base href="/infra-proxy/osm-ng-ui/$id8/">';
        sub_filter 'href="/' 'href="/infra-proxy/osm-ng-ui/$id8/';
        sub_filter 'src="/' 'src="/infra-proxy/osm-ng-ui/$id8/';
        sub_filter 'action="/' 'action="/infra-proxy/osm-ng-ui/$id8/';
        sub_filter 'url(/' 'url(/infra-proxy/osm-ng-ui/$id8/';

        # Ensure API calls hit the proxied UI (which then proxies to OSM NBI inside the topology network).
        sub_filter '"/osm' '"/infra-proxy/osm-ng-ui/$id8/osm';
        sub_filter \"'/osm\" \"'/infra-proxy/osm-ng-ui/$id8/osm\";
        sub_filter '\\/osm' '\\/infra-proxy/osm-ng-ui/$id8/osm';

        proxy_pass $osm_ng_ui_upstream/$path$is_args$args;
    }

    # Same-origin proxy for per-topology ETSI OSM Light UI.
    # Usage: /infra-proxy/osm-light-ui/<topology_id8>/<path...>
    location ~ "^/infra-proxy/osm-light-ui/([0-9a-f]{8})/osm/admin/v1/vim_accounts/[^/]+/resources(/.*)?$" {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"resources":{},"images":[],"networks":[],"tenants":[],"flavors":[]}';
    }

    location ~ "^/infra-proxy/osm-light-ui/([0-9a-f]{8})/osm/ro/v1/vim_accounts/[^/]+/resources(/.*)?$" {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"resources":{},"images":[],"networks":[],"tenants":[],"flavors":[]}';
    }

    location ~ "^/infra-proxy/osm-light-ui/([0-9a-f]{8})/osm/admin/v1/sdn_controllers(/.*)?$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $rest $2;
        set $osm_nbi_upstream http://caduceus-osm-topo-$id8-nbi:9999;
        set $osm_accept "application/json";
        if ($http_accept ~* "(application/zip|text/plain)") { set $osm_accept $http_accept; }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-light-ui/$id8;
        proxy_set_header Accept $osm_accept;

        proxy_cookie_path / /infra-proxy/osm-light-ui/$id8/;
        proxy_cookie_flags session_id nosecure;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $osm_nbi_upstream/osm/admin/v1/sdns$rest$is_args$args;
    }

    location ~ "^/infra-proxy/osm-light-ui/([0-9a-f]{8})/osm/admin/v1/sdns(/.*)?$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $rest $2;
        set $osm_nbi_upstream http://caduceus-osm-topo-$id8-nbi:9999;
        set $osm_accept "application/json";
        if ($http_accept ~* "(application/zip|text/plain)") { set $osm_accept $http_accept; }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-light-ui/$id8;
        proxy_set_header Accept $osm_accept;

        proxy_cookie_path / /infra-proxy/osm-light-ui/$id8/;
        proxy_cookie_flags session_id nosecure;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $osm_nbi_upstream/osm/admin/v1/sdns$rest$is_args$args;
    }

    location ~ "^/infra-proxy/osm-light-ui/([0-9a-f]{8})/osm(/.*)?$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $rest $2;
        set $osm_nbi_upstream http://caduceus-osm-topo-$id8-nbi:9999;
        set $osm_accept "application/json";
        if ($http_accept ~* "(application/zip|text/plain)") { set $osm_accept $http_accept; }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-light-ui/$id8;
        proxy_set_header Accept $osm_accept;

        # OSM NBI sets `Secure` cookies by default; strip it because this UI runs over plain HTTP in dev.
        # Also scope cookies to the proxy prefix to avoid cross-topology collisions.
        proxy_cookie_path / /infra-proxy/osm-light-ui/$id8/;
        proxy_cookie_flags session_id nosecure;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $osm_nbi_upstream/osm$rest$is_args$args;
    }

    location ~ "^/infra-proxy/osm-light-ui/([0-9a-f]{8})/(.*)$" {
        resolver 127.0.0.11 valid=10s;
        set $id8 $1;
        set $path $2;
        set $osm_light_ui_upstream http://caduceus-osm-topo-$id8-light-ui:80;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /infra-proxy/osm-light-ui/$id8;
        proxy_set_header Accept-Encoding "";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Keep upstream redirects inside this proxy prefix.
        absolute_redirect off;
        proxy_redirect ~^(/.*)$ $scheme://$http_host/infra-proxy/osm-light-ui/$id8$1;

        # Avoid cross-topology cookie collisions by scoping cookies to the proxy prefix.
        proxy_cookie_path / /infra-proxy/osm-light-ui/$id8/;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;

        # Best-effort rewrite for apps that hardcode absolute paths.
        sub_filter 'href="/' 'href="/infra-proxy/osm-light-ui/$id8/';
        sub_filter 'src="/' 'src="/infra-proxy/osm-light-ui/$id8/';
        sub_filter 'action="/' 'action="/infra-proxy/osm-light-ui/$id8/';
        sub_filter 'url(/' 'url(/infra-proxy/osm-light-ui/$id8/';

        # If the UI uses absolute /osm calls, rewrite them under this prefix.
        sub_filter '"/osm' '"/infra-proxy/osm-light-ui/$id8/osm';
        sub_filter \"'/osm\" \"'/infra-proxy/osm-light-ui/$id8/osm\";
        sub_filter '\\/osm' '\\/infra-proxy/osm-light-ui/$id8/osm';

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $osm_light_ui_upstream/$path$is_args$args;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
