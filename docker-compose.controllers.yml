version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mininet-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: mininet_web_framework
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mininet-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Backend Service with All SDN Controllers
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.controllers
    container_name: mininet-backend-controllers
    restart: unless-stopped
    ports:
      - "5000:5000"    # Flask API
      - "6633:6633"    # OpenFlow (Ryu, POX, os-ken)
      - "8181:8181"    # OpenDaylight REST API
      - "8101:8101"    # OpenDaylight SSH (Karaf)
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - DATABASE_NAME=mininet_web_framework
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - POX_HOME=/opt/pox
      - ODL_HOME=/opt/opendaylight
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /lib/modules:/lib/modules:ro
      # Controller data persistence
      - pox_data:/opt/pox
      - odl_data:/opt/opendaylight/data
      - odl_logs:/opt/opendaylight/data/log
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mininet-network
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
      - SYS_MODULE
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Longer startup time for controllers

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mininet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mininet-network
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Standalone OpenDaylight service (for advanced use)
  opendaylight:
    image: opendaylight/opendaylight:17.0.1
    container_name: mininet-opendaylight-standalone
    restart: unless-stopped
    ports:
      - "8182:8181"    # Alternative REST API port
      - "8102:8101"    # Alternative SSH port
      - "6634:6633"    # Alternative OpenFlow port
    environment:
      - JAVA_MAX_MEM=2048m
      - JAVA_MIN_MEM=512m
    volumes:
      - odl_standalone_data:/opt/opendaylight/data
      - odl_standalone_logs:/opt/opendaylight/data/log
    networks:
      - mininet-network
    profiles:
      - standalone  # Only start with: docker-compose --profile standalone up
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/restconf/operational/system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  mininet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  pox_data:
    driver: local
  odl_data:
    driver: local
  odl_logs:
    driver: local
  odl_standalone_data:
    driver: local
  odl_standalone_logs:
    driver: local
