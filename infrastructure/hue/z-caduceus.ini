# Caduceus-Flux Hue overrides (merged with Hue defaults).

[desktop]
# NOTE: Use a stable secret for dev/test; override via bind-mount if needed.
secret_key=caduceus_flux_change_me_hue_secret_key

# The gateway/frontend sit in front of Hue; trust X-Forwarded-Host for correct links.
use_x_forwarded_host=true

# Keep framing enabled for same-origin embedding via the frontend /infra-proxy.
http_x_frame_options=SAMEORIGIN


[beeswax]
hive_server_host=hive-server2
hive_server_port=10000
hive_metastore_host=hive-metastore
hive_metastore_port=9083
thrift_version=11


[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs=hdfs://hdfs-namenode:8020
webhdfs_url=http://hdfs-namenode:9870/webhdfs/v1

