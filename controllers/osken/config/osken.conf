# OS-Ken Controller Configuration

[DEFAULT]
# Logging
log_dir = /var/log/osken
log_file = osken.log
log_level = INFO

# OpenFlow
ofp_listen_host = 0.0.0.0
ofp_tcp_listen_port = 6653
ofp_ssl_listen_port = 6653

# REST API
wsapi_host = 0.0.0.0
wsapi_port = 8080

# Topology
observe_links = True

# Default applications
app_lists = 
    ryu.app.simple_switch_13
    ryu.app.rest_topology

