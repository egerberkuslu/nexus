# Grafana Configuration for Caduceus-Flux

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3001
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
serve_from_sub_path = true

[database]
type = postgres
host = postgres:5432
name = grafana
user = ${POSTGRES_USER}
password = ${POSTGRES_PASSWORD}

[security]
admin_user = admin
admin_password = ${GRAFANA_ADMIN_PASSWORD}
allow_embedding = true
cookie_secure = false
cookie_samesite = lax

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/topology-overview.json

[users]
allow_sign_up = false
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[metrics]
enabled = true
interval_seconds = 10

[alerting]
enabled = true
execute_alerts = true

[unified_alerting]
enabled = true

[plugins]
enable_alpha = false
allow_loading_unsigned_plugins = ""

