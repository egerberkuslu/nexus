# Nginx API Gateway Configuration for Caduceus-Flux

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss application/json;

    # DNS resolver for Docker
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Main server block
    server {
        listen 80;
        server_name _;

        client_max_body_size 500M;
        client_body_timeout 300s;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 10;

        # Set upstream variables for deferred DNS resolution (avoids startup errors)
        set $topology_upstream "http://topology-service:8001";
        set $orchestrator_upstream "http://orchestrator-service:8002";
        set $protocol_manager_upstream "http://protocol-manager-service:8003";
        set $device_manager_upstream "http://device-manager-service:8004";
        set $controller_manager_upstream "http://controller-manager-service:8005";
        set $snapshot_upstream "http://snapshot-service:8006";
        set $webshell_upstream "http://webshell-service:8007";
        set $export_import_upstream "http://export-import-service:8008";
        set $topology_generator_upstream "http://topology-generator-service:8009";
        set $p4_manager_upstream "http://p4-manager-service:8010";
	        set $monitoring_upstream "http://monitoring-service:8011";
	        set $ai_gateway_upstream "http://ai-gateway-service:8014";
	        set $mcp_upstream "http://mcp-server:8012";
	        set $metrics_collector_upstream "http://metrics-collector-service:8013";
	        set $prometheus_upstream "http://prometheus:9090";
	        set $grafana_upstream "http://grafana:3000";
	        set $jupyter_upstream "http://jupyterlab:8888";
	        set $frontend_upstream "http://frontend:80";

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API routing - Topology Service
        # MCP Server (gateway-level APIs)
        location = /api/services {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ^~ /api/services/ {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/microservices {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/system/status {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API health alias (handled by MCP server)
        location = /api/health {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Docs index and per-service docs proxied to MCP
        location = /api/docs {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ^~ /api/docs/ {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ^~ /api/redoc/ {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/redoc {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ^~ /api/openapi/ {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/openapi {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API routing - Topology Service
        location /api/projects {
            proxy_pass $topology_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/project {
            proxy_pass $topology_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/topologies {
            proxy_pass $topology_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Orchestrator endpoints under /api/topologies/* (must be routed before topology-service)
        location ~ ^/api/topologies/[^/]+/(apply|observability|infra)/ {
            proxy_pass $orchestrator_upstream;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/network-configs {
            proxy_pass $topology_upstream;
            include /etc/nginx/proxy_params.conf;
        }

	        # API routing - Emulation Orchestrator
	        # UI-compatible orchestrator routes (frontend calls /api/orchestrator/*)
	        location ^~ /api/orchestrator/ {
	            proxy_pass $orchestrator_upstream;
	            include /etc/nginx/proxy_params.conf;
	            proxy_read_timeout 600s;
	            proxy_send_timeout 600s;
	        }

	        location /api/emulation {
	            proxy_pass $orchestrator_upstream;
	            include /etc/nginx/proxy_params.conf;
	            proxy_read_timeout 600s;
	            proxy_send_timeout 600s;
	        }

	        # API routing - In-Emulation Algorithms (Orchestrator)
	        # NOTE: Without this explicit route, `/api/algorithms/*` can fall through to the frontend
	        # and create a proxy loop (gateway -> frontend -> gateway), which surfaces as 503s in the UI.
	        location ^~ /api/algorithms {
	            proxy_pass $orchestrator_upstream;
	            include /etc/nginx/proxy_params.conf;
	            proxy_read_timeout 600s;
	            proxy_send_timeout 600s;
	        }

	        # API routing - Test Runner (Orchestrator)
	        location /api/tests {
	            proxy_pass $orchestrator_upstream;
	            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # API routing - Diagnostics (Orchestrator)
        location /api/diagnostics {
            proxy_pass $orchestrator_upstream;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # API routing - Infrastructure (Orchestrator)
        location /api/infrastructure {
            proxy_pass $orchestrator_upstream;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # API routing - Protocol Manager
        location /api/protocols {
            proxy_pass $protocol_manager_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API routing - Device Manager
        location /api/devices {
            proxy_pass $device_manager_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API routing - Controller Manager
        location /api/controllers {
            proxy_pass $controller_manager_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API routing - Snapshot Service
        location /api/snapshots {
            proxy_pass $snapshot_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API routing - Export/Import
        location /api/export {
            proxy_pass $export_import_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/import {
            proxy_pass $export_import_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API routing - Topology Generator
        location /api/generate {
            proxy_pass $topology_generator_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # API routing - P4 Manager
        location /api/p4 {
            proxy_pass $p4_manager_upstream;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # API routing - Monitoring
        # Convenience health alias (monitoring-service exposes /health, not /api/monitoring/health)
        location = /api/monitoring/health {
            proxy_pass $monitoring_upstream/health;
            include /etc/nginx/proxy_params.conf;
        }

        # Prometheus metrics alias (monitoring-service exposes /metrics)
        location = /api/metrics {
            proxy_pass $monitoring_upstream/metrics;
            include /etc/nginx/proxy_params.conf;
        }

	        location /api/monitoring {
	            proxy_pass $monitoring_upstream;
	            include /etc/nginx/proxy_params.conf;
	        }

	        # Metrics Collector control (start/stop/health)
	        # Strip the `/api/metrics-collector/` prefix when proxying (service exposes `/health` and `/api/*`).
	        location = /api/metrics-collector {
	            return 308 /api/metrics-collector/;
	        }

	        location ^~ /api/metrics-collector/ {
		            # When proxy_pass uses a variable, Nginx does not perform URI rewriting.
		            # Strip the prefix explicitly so `/api/metrics-collector/health` becomes `/health`.
		            rewrite ^/api/metrics-collector/(.*)$ /$1 break;
		            proxy_pass $metrics_collector_upstream;
		            include /etc/nginx/proxy_params.conf;
		            proxy_read_timeout 60s;
		            proxy_send_timeout 60s;
		        }

	        # Monitoring legacy alias
	        location /api/topology {
	            proxy_pass $monitoring_upstream;
	            include /etc/nginx/proxy_params.conf;
	        }

        # API routing - AI Gateway (LLMs + MCP Console)
        location /api/ai {
            proxy_pass $ai_gateway_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Fallback: route any other `/api/*` to MCP server.
        # This enables service-prefixed routing like `/api/mano/*`, `/api/osm/*`, `/api/config/*`, etc.
        location /api/ {
            proxy_pass $mcp_upstream;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # WebSocket routing - Topology updates (must come before /ws/)
        location /ws/topology/ {
            proxy_pass $topology_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 86400;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # WebSocket routing - WebShell
        # Must come before the catch-all location block
        location /ws/ {
            proxy_pass $webshell_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 86400;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Prometheus proxying
        location /prometheus/ {
            proxy_pass $prometheus_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        # Grafana proxying
        location /grafana/ {
            proxy_pass $grafana_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        # JupyterLab (Data Lab)
        location = /jupyter {
            return 308 /jupyter/;
        }

        location ^~ /jupyter/ {
            proxy_pass $jupyter_upstream;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60s;

            # Allow embedding JupyterLab in the frontend (same-origin iframe)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }

        # Frontend (served by separate container or static files)
        location / {
            proxy_pass $frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
